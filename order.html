<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อสินค้า — Body Scent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="brand-logo">Body Scent</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="product.html">สินค้า</a></li>
          <li><a href="order.html">สั่งซื้อ</a></li>
          <li><a href="admin.html">แอดมิน</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container" style="max-width: 640px;">
        <div class="section-header">
          <span class="section-subtitle">Order Placement</span>
          <h1>แบบฟอร์มสั่งซื้อสินค้า</h1>
          <p style="color: var(--text-secondary); margin-top: 0.75rem;">
            กรุณาตรวจสอบรายการสินค้าและกรอกข้อมูลสำหรับการจัดส่ง
          </p>
        </div>

        <div style="background-color: var(--bg-card); border: var(--border-thin); padding: 2.75rem 2.25rem;">
          <form id="orderForm">
            <div class="form-group">
              <label for="customerName" class="form-label">ชื่อลูกค้า *</label>
              <input type="text" id="customerName" name="customerName" class="form-control" placeholder="ระบุชื่อ-นามสกุลผู้รับ" required>
            </div>

            <div class="form-group">
              <label for="contact" class="form-label">เบอร์โทร / Line ID *</label>
              <input type="text" id="contact" name="contact" class="form-control" placeholder="ระบุเบอร์โทรศัพท์ หรือ Line ID สำหรับติดต่อ" required>
            </div>

            <div class="form-group">
              <label for="items" class="form-label">รายการสินค้า *</label>
              <input type="text" id="items" name="items" class="form-control" placeholder="ระบุชื่อสินค้าและขนาด" required>
            </div>

            <div class="form-group">
              <label for="total" class="form-label">จำนวนเงินรวม (บาท) *</label>
              <input type="number" id="total" name="total" class="form-control" placeholder="0" required>
            </div>

            <div class="form-group" style="margin-bottom: 2.5rem;">
              <label for="note" class="form-label">หมายเหตุ / ที่อยู่จัดส่ง</label>
              <textarea id="note" name="note" class="form-control" rows="3" placeholder="ระบุที่อยู่จัดส่ง หรือข้อความเพิ่มเติมถึงร้านค้า"></textarea>
            </div>

            <button type="submit" class="btn btn-bronze" style="width: 100%;">ยืนยันสั่งซื้อ</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <a href="index.html" class="brand-logo">Body Scent</a>
      <p>กลิ่นหอมที่สะท้อนตัวตนและอารมณ์ของคุณอย่างละเมียดละไม</p>
      <p style="margin-top: 0.75rem; font-size: 0.75rem; color: var(--text-muted);">&copy; 2026 Body Scent. All rights reserved.</p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
